<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📖 Book Reader</title>
    <link rel="stylesheet" href="style.css">
    <script src="coi-serviceworker.js"></script>
</head>
<body>
    <!-- UI Login -->
    <div id="loginView" class="view active">
        <div class="login-card">
            <div class="login-brand">
                <span class="login-brand-icon">📖</span>
                <div class="login-brand-name">BOOK READER</div>
                <div class="login-brand-sub">Baca cerita dengan suara</div>
            </div>
            <div class="login-divider"></div>
            <input type="text" id="username" placeholder="Username" autocomplete="username">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button id="loginBtn" onclick="doLogin()">🔐 MASUK</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- UI Reader -->
    <div id="readerView" class="view">
        <header class="reader-header">
            <button id="backBtn" class="reader-back" onclick="loadLibrary()">←</button>
            <div id="headerTitle" class="reader-header-title">📖 Library</div>
            <button id="addBtn" class="reader-header-btn" onclick="openAddParagraphModal()" style="display:none;">➕</button>
        </header>

        <div class="reader-topbar">
            <select id="langSelector">
                <option value="ms">🇲🇾 Bahasa Melayu</option>
            </select>
            <!-- DROPDOWN SUARA -->
            <select id="voiceSelector">
                <option value="sarah">👩 Sarah (Wanita)</option>
                <option value="angellyn">👩 Angellyn (Wanita)</option>
                <option value="paan">👩 Paan (Wanita)</option>
                <option value="budi">👨 Budi (Pria)</option>
            </select>
            <button onclick="doLogout()">🚪</button>
        </div>
        
        <main id="contentArea" class="reader-main">
            <!-- Konten dinamis dimuat di sini -->
        </main>

        <!-- TTS Bar -->
        <div id="ttsBar" class="reader-tts-bar">
            <button id="prevBtn" class="reader-tts-btn" onclick="navigateParagraph('prev')">⏮</button>
            <button id="playBtn" class="reader-tts-btn reader-tts-play" onclick="togglePlay()" disabled>⏳ Menyiapkan...</button>
            <button id="nextBtn" class="reader-tts-btn" onclick="navigateParagraph('next')">⏭</button>
            <button id="stopBtn" class="reader-tts-btn" onclick="stopTTS()">⏹</button>
            
            <div class="reader-tts-controls">
                <div class="reader-tts-speed">
                    <span>Spd</span>
                    <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1" oninput="updateSpeedLabel()">
                    <span id="speedLabel">1.0×</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Edit Tag -->
    <div id="editTagOverlay" class="audit-modal-overlay">
        <div class="audit-modal">
            <div class="audit-modal-header">
                <div class="audit-modal-title">⚙️ Edit Paragraf</div>
                <button class="audit-modal-close" onclick="closeModal('editTagOverlay')">✕</button>
            </div>
            <div class="audit-modal-body">
                <div class="reader-voice-row"><label>Peran</label><select id="editWhoTag"><option value="NARRATOR">Narator</option><option value="AKTOR">Aktor</option></select></div>
                <div class="reader-voice-row"><label>Gender</label><select id="editGender"><option value="FEMALE">Wanita</option><option value="MALE">Pria</option><option value="CHILD">Anak-anak</option></select></div>
                <div class="reader-voice-row"><label>Bahasa</label><select id="editLangTag"><option value="ms">Melayu</option><option value="id">Indonesia</option><option value="en">English</option></select></div>
                <div style="display:flex; gap:8px; justify-content:center; margin-top:15px;">
                    <button class="btn btn-secondary" onclick="moveParagraph('up')">⬆️ Naik</button>
                    <button class="btn btn-secondary" onclick="moveParagraph('down')">⬇️ Turun</button>
                </div>
                <button class="btn btn-danger" style="width:100%; margin-top:10px;" onclick="deleteParagraph()">🗑️ Hapus Paragraf</button>
            </div>
            <div class="audit-modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('editTagOverlay')">Batal</button>
                <button class="btn btn-primary" onclick="saveTagToSheet()">Simpan Tag</button>
            </div>
        </div>
    </div>

    <!-- Modal Add Paragraph -->
    <div id="addParagraphOverlay" class="audit-modal-overlay">
        <div class="audit-modal" style="max-width: 500px;">
            <div class="audit-modal-header">
                <div class="audit-modal-title">➕ Tambah Paragraf Baru</div>
                <button class="audit-modal-close" onclick="closeModal('addParagraphOverlay')">✕</button>
            </div>
            <div class="audit-modal-body">
                <div class="reader-voice-row"><label>Book ID</label><input type="text" id="addBookId"></div>
                <div class="reader-voice-row"><label>Judul</label><input type="text" id="addBookTitle"></div>
                <div class="reader-voice-row"><label>Chapter</label><input type="number" id="addChapterNum"></div>
                <div class="reader-voice-row"><label>Judul Bab</label><input type="text" id="addChapterTitle"></div>
                <div class="reader-voice-row"><label>Peran</label><select id="addWhoTag"><option value="NARRATOR">Narator</option><option value="AKTOR">Aktor</option></select></div>
                <div class="reader-voice-row"><label>Gender</label><select id="addGender"><option value="FEMALE">Wanita</option><option value="MALE">Pria</option><option value="CHILD">Anak-anak</option></select></div>
                <div class="reader-voice-row"><label>Bahasa</label><select id="addLangTag"><option value="ms">Melayu</option><option value="id">Indonesia</option><option value="en">English</option></select></div>
                <textarea id="addText" rows="5" placeholder="Teks cerita..."></textarea>
            </div>
            <div class="audit-modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addParagraphOverlay')">Batal</button>
                <button class="btn btn-primary" onclick="saveNewParagraph()">💾 Simpan</button>
            </div>
        </div>
    </div>

    <!-- Toast & Loading & Confirm -->
    <div id="toast">✅ Berhasil</div>
    <div id="loadingOverlay"><div class="spinner"></div></div>
    
    <div id="customConfirmOverlay">
        <div class="confirm-box">
            <div id="confirmTitle" class="confirm-title">Peringatan</div>
            <div id="confirmMessage" class="confirm-message">Apakah Anda yakin?</div>
            <div class="confirm-btn-group">
                <button id="confirmBtnYes" class="btn btn-primary">Ya</button>
                <button id="confirmBtnCancel" class="btn btn-secondary">Batal</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
